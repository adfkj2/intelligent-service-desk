name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的旧流水线直接取消，省 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（./mvnw verify）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # runner 自带 Docker，AbstractIntegrationTest 会启动 MySQL 8 与 Redis 7 容器；
      # verify 同时覆盖编译、102 个用例、覆盖率门禁与打 jar
      # 用 wrapper 而不是裸 mvn：Maven 版本由 .mvn/wrapper/maven-wrapper.properties 锁定
      - name: 授权 mvnw
        run: chmod +x mvnw

      - name: 测试并打包
        run: ./mvnw -B -ntp verify

      # 数字守卫：README「关键数字」是唯一事实源，加了用例却没同步文档会在这里失败
      - name: 用例数守卫
        run: |
          actual=$(grep -rh "@Test" --include="*.java" src/test | wc -l)
          expected=$(sed -n 's/^| 后端用例 | \([0-9]\+\) |$/\1/p' README.md)
          echo "实际 @Test=$actual，README 声明=$expected"
          test -n "$expected"
          test "$actual" = "$expected"

      # 失败时把 surefire 报告带出来，不用在几百行日志里翻断言
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # 覆盖率报告无论成败都传：失败时恰恰最需要看哪一行没被覆盖
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  frontend:
    name: 前端（npm build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 只拦生产依赖：devDeps 的告警多半是构建期工具，不值得阻塞发版。
      # 显式指定官方 registry：国内镜像（npmmirror）没有实现 audit 端点，会直接报 NOT_IMPLEMENTED
      - name: 依赖漏洞扫描
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      # 先 lint 再构建：语法/未定义变量这类问题比"构建产物能不能生成"更早暴露
      - name: 静态检查
        run: npm run lint

      # 单测跑在构建之前：拦截器/store 的逻辑坏了，构建照样成功，只有测试能发现
      - name: 单元测试
        run: npm test

      # 产物写进 ../src/main/resources/static，和本地构建一致
      - name: 构建
        run: npm run build

  image:
    name: 镜像（docker build）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # 不推送，只为拦住"只在本地机器能构建"的退化（缺文件、依赖本机 static、忘记 .dockerignore）
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: isd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E（Playwright + prod 栈）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      # 与 deploy/certs/generate.ps1 等价；runner 自带 openssl，SAN 必须带 localhost
      - name: 生成自签证书
        run: |
          mkdir -p deploy/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout deploy/certs/server.key -out deploy/certs/server.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      # 不传 MAVEN_MIRROR_URL：GitHub runner 访问 Maven Central 正常，镜像参数只服务国内本机
      - name: 启动 prod 栈
        run: docker compose -f docker-compose.prod.yml up -d --build

      # 首次启动要等 MySQL 健康 + Flyway 迁移 + jar 起来，180s 是宽裕上限
      - name: 等待应用就绪
        run: |
          for i in $(seq 1 90); do
            if curl -k --fail --silent https://localhost/api/ping > /dev/null; then
              echo "app ready after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "应用 180s 内未就绪"
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=200
          exit 1

      - name: 灌入演示账号
        run: |
          docker compose -f docker-compose.prod.yml exec -T mysql \
            mysql -uroot -p123456 isd < web/e2e/seed.sql

      - name: 安装 Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: 主流程 E2E
        working-directory: web
        run: npx playwright test

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      # 失败时把容器日志带出来，省得本地复现
      - name: 容器日志
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=300

      - name: 停栈
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  perf:
    name: 压测（k6 冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 走 stack（http 8081）：避开 Secure Cookie 与证书，启动最快
      - name: 启动全栈
        run: docker compose -f docker-compose.stack.yml up -d --build

      - name: 等待应用就绪
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8081/api/ping > /dev/null; then
              echo "app ready after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "应用 180s 内未就绪"
          docker compose -f docker-compose.stack.yml logs --tail=200
          exit 1

      - name: 注册压测账号
        run: |
          curl -s -c /tmp/cookies.txt http://localhost:8081/api/ping > /dev/null
          XSRF=$(awk '$6 == "XSRF-TOKEN" { print $7 }' /tmp/cookies.txt)
          test -n "$XSRF"
          code=$(curl -s -b /tmp/cookies.txt -o /tmp/register.json -w "%{http_code}" \
            -H "Content-Type: application/json" -H "X-XSRF-TOKEN: $XSRF" \
            -d '{"username":"perf_emp","password":"perf12345","fullName":"压测账号"}' \
            http://localhost:8081/api/auth/register)
          echo "register status: $code"
          cat /tmp/register.json
          # 201 = 首次创建；409 = 账号已存在（重跑），都算准备就绪
          test "$code" = "201" || test "$code" = "409"

      # 只调 VUS/DURATION/SEED_TICKETS 缩短时间，阈值不许放宽
      - name: k6 工单读路径
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$PWD/perf/k6:/scripts:ro" \
            -e BASE_URL=http://host.docker.internal:8081 \
            -e VUS=5 -e DURATION=5s -e SEED_TICKETS=200 \
            grafana/k6:0.54.0 run /scripts/tickets.js

      - name: k6 AI 降级与配额
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$PWD/perf/k6:/scripts:ro" \
            -e BASE_URL=http://host.docker.internal:8081 \
            -e ITERATIONS=25 \
            grafana/k6:0.54.0 run /scripts/ai.js

      - name: 停栈
        if: always()
        run: docker compose -f docker-compose.stack.yml down -v
