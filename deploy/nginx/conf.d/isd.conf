# 80 → 443：演示环境不希望有人用明文访问（HSTS 也只在 https 下才有效）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签证书由 deploy/certs/generate.ps1 生成，只用于本地演示
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头这里只补 Referrer-Policy：
    # HSTS / X-Content-Type-Options / X-Frame-Options 由 Spring Security 统一输出，
    # 两边都加会在响应头里出现重复的一组（实测确实重复过），不致命但会误导排障。
    # 以后 app 前面再挂网关时，把这三条搬回 Nginx 也可以。
    add_header Referrer-Policy same-origin always;

    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/plain application/xml;

    # 后端所有请求都转发到 app:8081（容器网络内的服务名）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 静态资源带内容哈希，可以长期缓存；绝不缓存 index.html 与 /api/
    location /assets/ {
        proxy_pass http://app:8081;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://app:8081;
        # AI 接口最长 30s 硬超时 + 2 次重试，反代超时必须更宽，否则会把"慢"变成"502"
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        # 关掉响应缓冲：长回答/未来改成流式时不会被攒在 Nginx 里
        proxy_buffering off;
    }

    # SPA：/、/login、/tickets/1 等全部交给后端的转发控制器处理
    location / {
        proxy_pass http://app:8081;
    }
}
