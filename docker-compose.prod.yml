# 生产向编排：Nginx 终止 TLS，应用只在容器网络内暴露 8081。
#
#   .\deploy\certs\generate.ps1                     # 先生成自签证书
#   docker compose -f docker-compose.prod.yml up -d --build
#   curl -k https://localhost/api/ping
#
# 与 docker-compose.stack.yml 的区别（三选一，不要同时起）：
#   docker-compose.yml        本地开发依赖，只有 Redis
#   docker-compose.stack.yml  全栈但 app 直接暴露 8081，适合演示/验收
#   本文件                    全栈 + TLS + 反代，app 不映射宿主机端口
name: isd-prod

services:
  mysql:
    image: mysql:8.0.36
    container_name: isd-prod-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: isd
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - isd-prod-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: isd-prod-redis
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Egx"]
    volumes:
      - isd-prod-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: isd:local
    container_name: isd-prod-app
    # 不再映射 8081：外部只能经 Nginx 进来，避免绕过 TLS 与安全响应头
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://mysql:3306/isd?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-local-placeholder}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: isd-prod-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  isd-prod-mysql-data:
  isd-prod-redis-data:
