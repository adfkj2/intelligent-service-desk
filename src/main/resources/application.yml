server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true      # 禁止 JS 读取会话 Cookie，降低 XSS 窃取风险
        same-site: lax       # 跨站请求不带 Cookie，配合关闭 CSRF 时的主要防线

spring:
  application:
    name: isd
  profiles:
    active: local
  datasource:
    # createDatabaseIfNotExist：新环境不用先手工建库，Flyway 接着把表补齐。
    # 整体走 DB_URL：容器里要指向 mysql 服务名，本机默认值保持不变（本地开发不用设任何环境变量）。
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/isd?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      # 会话存储：docker compose up -d 起本地 Redis，详见仓库根目录 docker-compose.yml
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      # Redis 抖动时快速失败，避免请求线程被无限挂住（会话读取在每个请求的过滤器里）
      timeout: 2s
      connect-timeout: 2s

  session:
    # 会话空闲超时：Spring Session 自己的口径，与 server.servlet.session.timeout 保持一致；
    # 后者仍需保留，因为 Cookie 的 http-only / same-site 由 server.servlet.session.cookie.* 下发
    timeout: 30m
    redis:
      namespace: isd:session
      # indexed 不是可选项而是刚需：只有索引版仓库会维护 "principal -> sessionId" 的 Set，
      # "重置密码后踢人"正是靠这个索引找会话。Boot 3.5 默认是 default（非索引），
      # 那样 findByPrincipalName 不可用，只能全库 SCAN。
      repository-type: indexed
      # on_save：一次请求内多次改属性只在响应写出时落一次 Redis，减少写放大
      flush-mode: on_save
      save-mode: on_set_attribute

  flyway:
    # 表结构只由 db/migration/V*.sql 管理；不再维护手写的幂等 ALTER 段
    locations: classpath:db/migration
    # 老库（已有表但没有 flyway_schema_history）第一次启动时打基线：
    # 把 V1 记为已应用，避免重复建表报 "table already exists"
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  ai:
    openai:
      # 真实 Key 放在 application-local.yml（已被 .gitignore 排除）或环境变量 DEEPSEEK_API_KEY。
      # 默认值只是占位符：AgentService 识别到占位符会直接走降级，不会发起网络请求。
      api-key: ${DEEPSEEK_API_KEY:local-placeholder}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
    retry:
      # 默认重试次数偏高，配上我们的外层超时会显得很慢，这里压到 2 次
      max-attempts: 2
      backoff:
        initial-interval: 500ms

# 项目自定义配置
isd:
  ai:
    # 单次对话的硬超时（秒）：超过就走知识库降级，不能让用户干等
    timeout-seconds: 30
    rate-limit:
      # 成本护栏：每次对话都按 token 计费，没有配额等于对刷接口敞开大门
      enabled: true
      # 单用户每分钟配额：正常提问远达不到，连续刷才会撞上
      max-per-user: 20
      # 单 IP 分钟配额故意放宽：办公室 NAT 后大家共用一个出口
      max-per-ip: 60
      window-seconds: 60
  auth:
    login:
      # 同账号连续失败 5 次锁 15 分钟（主要防线：攻击者换 IP 也挡得住）
      max-failures-per-user: 5
      # 同 IP 失败 20 次才锁：阈值故意放宽，办公室 NAT 后大家共用一个出口 IP
      max-failures-per-ip: 20
      lock-minutes: 15
  notification:
    relay:
      # 发件箱投递节奏：每 5 秒取一批。fixedDelay，跑不完不叠加下一轮
      interval-ms: 5000
      # 启动后先等 10 秒，让 Flyway 迁移和应用预热先完成
      initial-delay-ms: 10000
      # 单批事件数：一次扫描的 PENDING 上限，积压时靠多轮消化
      batch-size: 100
      # 同一事件最多尝试 5 次，之后转 FAILED 等人工介入，避免毒消息占住队头
      max-attempts: 5
  retention:
    # 数据保留策略：ai_chat_log / outbox_event / notification 都是只增不减的表
    enabled: true
    # 每天 03:30 跑，避开使用高峰（6 位：秒 分 时 日 月 周）
    cron: "0 30 3 * * *"
    # 分批删除：单批 1000 行，单轮最多 50 批 = 单表每天最多删 5 万行，积压靠次日消化
    batch-size: 1000
    max-batches: 50
    # 保留天数取长值：宁可多占一点空间，也不要在首次上线时把历史数据一次删光
    ai-log-days: 90
    outbox-sent-days: 30
    notification-read-days: 90

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.isd: DEBUG
  pattern:
    # 每条日志带上 TraceIdFilter 写入的 traceId，一次请求的日志可以按它串起来
    correlation: "[%X{traceId:-}] "

# 指标端点单独一个端口，并只绑本机：
# 8081 上完全不暴露 /actuator，Security 白名单不用改；生产环境应再加防火墙或反代鉴权。
management:
  server:
    port: 8082
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
