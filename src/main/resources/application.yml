server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true      # 禁止 JS 读取会话 Cookie，降低 XSS 窃取风险
        same-site: lax       # 跨站请求不带 Cookie，配合关闭 CSRF 时的主要防线

spring:
  application:
    name: isd
  profiles:
    active: local
  datasource:
    # createDatabaseIfNotExist：新环境不用先手工建库，Flyway 接着把表补齐
    url: "jdbc:mysql://127.0.0.1:3306/isd?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: ${DB_PASSWORD:}

  flyway:
    # 表结构只由 db/migration/V*.sql 管理；不再维护手写的幂等 ALTER 段
    locations: classpath:db/migration
    # 老库（已有表但没有 flyway_schema_history）第一次启动时打基线：
    # 把 V1 记为已应用，避免重复建表报 "table already exists"
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  ai:
    openai:
      # 真实 Key 放在 application-local.yml（已被 .gitignore 排除）或环境变量 DEEPSEEK_API_KEY。
      # 默认值只是占位符：AgentService 识别到占位符会直接走降级，不会发起网络请求。
      api-key: ${DEEPSEEK_API_KEY:local-placeholder}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
    retry:
      # 默认重试次数偏高，配上我们的外层超时会显得很慢，这里压到 2 次
      max-attempts: 2
      backoff:
        initial-interval: 500ms

# 项目自定义配置
isd:
  ai:
    # 单次对话的硬超时（秒）：超过就走知识库降级，不能让用户干等
    timeout-seconds: 30

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.isd: DEBUG
  pattern:
    # 每条日志带上 TraceIdFilter 写入的 traceId，一次请求的日志可以按它串起来
    correlation: "[%X{traceId:-}] "

# 指标端点单独一个端口，并只绑本机：
# 8081 上完全不暴露 /actuator，Security 白名单不用改；生产环境应再加防火墙或反代鉴权。
management:
  server:
    port: 8082
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
